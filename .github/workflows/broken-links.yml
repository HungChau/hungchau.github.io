name: Check for broken links

on:
  push:
  pull_request:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # exclude md files with liquid tags / hardcoded template-relative links,
          # and unsplash.com which returns 401 to CI bots (valid link, false positive)
          args: --exclude-path README.md --exclude-path _pages/404.md --exclude-path _pages/blog.md --exclude-path _pages/about_einstein.md --exclude-path _posts/2018-12-22-distill.md --exclude 'unsplash\.com' --verbose --no-progress './**/*.md' './**/*.html'
